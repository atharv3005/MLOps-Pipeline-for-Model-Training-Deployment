data_prep:
  test_size: 0.2
  random_state: 42

train:
  max_features: 2000
  ngram_range_min: 1
  ngram_range_max: 2
  C: 1.0
  max_iter: 1000
  random_state: 42
  min_accuracy_threshold: 0.70   # Gate: fails training/CI if test accuracy < 70%
  experiment_name: sentiment-classifier
  registered_model_name: sentiment-classifier

drift:
  drift_threshold: 0.03                 # 3.0% threshold: flags prediction distribution drift > 3%
  text_length_ks_pvalue_threshold: 0.05  # KS-test p-value threshold for input feature length shift
  class_balance_psi_threshold: 0.2       # PSI threshold for categorical population shift
  min_predictions_for_check: 20          # Minimum sample window required before running statistical checks

