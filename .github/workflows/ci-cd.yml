name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/sentiment-api

jobs:
  ci-test-and-validate:
    name: CI (Test, Train, Validate)
    runs-on: ubuntu-latest
    env:
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Configure DVC Remote Credentials (if configured)
        if: env.GDRIVE_SA_JSON != ''
        run: |
          echo "$GDRIVE_SA_JSON" > gdrive-sa.json
          dvc remote modify gdrive-storage gdrive_use_service_account true
          dvc remote modify gdrive-storage gdrive_service_account_json_file_path gdrive-sa.json
          dvc pull data/raw/reviews.csv

      - name: Run DVC Pipeline Reproduction
        run: |
          python src/data_prep.py
          python src/train.py

      - name: Run Automated Test Suite
        run: pytest tests/ -v

      - name: Upload Validated Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-artifacts
          path: models/
          retention-days: 7

  cd-build-and-deploy:
    name: CD (Docker Build & Deploy)
    needs: ci-test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Validated Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-model-artifacts
          path: models/

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Container Deployment Smoke Test
        run: |
          docker run -d --name test-api -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health || (docker logs test-api && exit 1)
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "MLOps pipeline automated deployment test"}'
          docker stop test-api